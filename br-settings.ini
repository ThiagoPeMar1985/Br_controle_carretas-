; ============================================================
;  BR Controle de Carretas — configuracao de teclas / binds
; ============================================================
;
;   Edite este arquivo com o jogo FECHADO.
;
;   Cada linha e uma acao: nome_da_acao=BIND
;   Use 0 (zero) para deixar uma acao sem bind.
;
;   Formatos aceitos na bind:
;
;     - Tecla simples:   A-Z, 0-9, F1-F12
;                        INSERT  DELETE  HOME  END  PAGEUP  PAGEDOWN
;                        UP  DOWN  LEFT  RIGHT
;                        SPACE  TAB  ENTER  BACKSPACE  ESCAPE
;                        NUMPAD0 ate NUMPAD9
;                        MINUS  EQUALS  COMMA  PERIOD
;                        (F13 em diante so existe em teclado IBM
;                         antigo — os de hoje vao ate F12)
;
;     - Com modificador: CTRL+DELETE   SHIFT+F5   ALT+J
;                        (pode combinar: CTRL+SHIFT+X)
;
;     - Botao de volante/joystick:  JOY0:B3
;                        (JOY<numero do controle>:B<numero do botao>
;                         controle vai de 0 a 15, botao de 0 a 31)
;
;     - Codigo numerico da tecla tambem funciona (ex.: 46 = Delete)
;
;   Ou entao nem mexa aqui: dentro do jogo, na janela do plugin,
;   clique na acao na coluna "Teclas" e aperte a tecla, o combo ou
;   o botao do volante que quiser — o plugin grava sozinho.
;
;   Se voce escrever um valor que o sistema nao aceita, a bind
;   volta para o padrao automaticamente:
;     toggle_ui     -> DELETE   (abre a janela do plugin)
;     toggle_cursor -> INSERT   (libera o cursor do mouse)
;   As duas tambem nao podem ficar iguais entre si — nesse caso
;   voltam ao padrao igualmente. Isso existe para voce nunca
;   ficar sem conseguir abrir o menu do plugin.
;
;   Este arquivo vale de duas formas:
;     1) Ao lado da DLL (pasta "plugins" do jogo): define
;        SEMPRE as teclas toggle_ui e toggle_cursor (elas nao
;        podem ser mudadas dentro do jogo), e serve de padrao
;        das demais binds na primeira vez que o plugin roda.
;     2) Em %APPDATA%\br_controle_de_carretas\settings.ini: e o
;        arquivo pessoal do usuario, criado e atualizado quando
;        ele remapeia teclas dentro do jogo — para as demais
;        acoes, esse arquivo e o que vale.
;
; ============================================================

[keybinds]
toggle_ui=DELETE
toggle_cursor=INSERT
; Numeracao:
;   A janela do plugin mostra "Carreta 1" (do jogo, tecla T),
;   "Carreta 2" (dolly/meio) e "Carreta 3" (traseira).
;   attach_detach_2 / attach_truck_2 agem na "Carreta 2" da janela.
;   attach_detach_3 / attach_truck_3 agem na "Carreta 3" da janela.
;   (os nomes das chaves ficam assim para nao quebrar arquivos salvos)
attach_detach_2=0
attach_detach_3=0
attach_truck_2=0
attach_truck_3=0

; ------------------------------------------------------------
; Eixos elevaveis
;
; reverse_lift=1 ergue o 1o eixo elevavel de cada carreta ao
; engatar a marcha-a-re, e abaixa ao sair da re.
;
; trailer_N e a mascara de eixos da "Carreta N" da janela
; (-1 = padrao do jogo). So eixos elevaveis contam — o plugin
; ignora bits de eixos fixos. Normalmente ajustado pela janela
; do plugin (switches "Eixo 1", "Eixo 2", ...).
; ATENCAO: aqui a numeracao e por posicao interna — trailer_0 e
; a "Carreta 1" da janela, trailer_1 e a "Carreta 2", e assim
; por diante.
[axle_lift]
reverse_lift=1
; trailer_0=-1
; trailer_1=-1
; trailer_2=-1
